<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Oʻahu arcade road trip</title><desc id="desc">A stylized game world with a coral car, a coastal road, turquoise water and angular island mountains. Decorative imagined scenery.</desc>
